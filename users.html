<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Users | Hotel Owner Panel</title>
<link rel="icon" href="data:,">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="app-shell">

<div class="filters-bar">
  <div class="row g-2 align-items-center">
    <div class="col-md-4">
      <div class="search-box w-100" style="max-width:100%"><i class="bi bi-search"></i>
        <input type="text" class="form-control w-100" id="searchInput" placeholder="Search users by name or email...">
      </div>
    </div>
    <div class="col-md-3">
      <select class="form-select" id="roleFilter"><option value="">All Roles</option></select>
    </div>
    <div class="col-md-2">
      <select class="form-select" id="statusFilter">
        <option value="">All Status</option>
        <option value="active">Active</option>
        <option value="inactive">Inactive</option>
      </select>
    </div>
    <div class="col-md-3">
      <select class="form-select" id="sortBy">
        <option value="name">Sort: Name (A-Z)</option>
        <option value="role">Sort: Role</option>
        <option value="status">Sort: Status</option>
        <option value="newest">Sort: Newest</option>
      </select>
    </div>
  </div>
</div>

<div class="d-flex flex-wrap gap-2 mb-3" id="roleSummary"></div>

<div class="d-flex align-items-center justify-content-between mb-2">
  <div id="resultsCount" class="text-muted small"></div>
  <div class="form-check d-none" id="selectAllWrap">
    <input class="form-check-input" type="checkbox" id="selectAllCheckbox">
    <label class="form-check-label small text-muted" for="selectAllCheckbox">Select all shown</label>
  </div>
</div>
<div class="bulk-bar d-none" id="bulkBar">
  <span class="fw-semibold small" id="bulkCount"></span>
  <div class="d-flex gap-2 ms-auto">
    <button class="btn btn-soft btn-sm" id="bulkActivateBtn"><i class="bi bi-toggle-on me-1"></i>Activate</button>
    <button class="btn btn-soft btn-sm" id="bulkDeactivateBtn"><i class="bi bi-toggle-off me-1"></i>Deactivate</button>
    <button class="btn btn-light-danger btn-sm" id="bulkDeleteBtn"><i class="bi bi-trash3 me-1"></i>Delete</button>
    <button class="btn btn-light btn-sm" id="bulkClearBtn">Clear</button>
  </div>
</div>
<div class="card-surface p-0 overflow-hidden">
  <div class="table-responsive">
    <table class="table-modern w-100">
      <thead><tr>
        <th style="width:36px"></th><th>User</th><th>Role</th><th>Parent Property</th><th>Competitor Properties</th><th>Status</th><th class="text-end">Actions</th>
      </tr></thead>
      <tbody id="usersBody"></tbody>
    </table>
  </div>
  <div id="emptyState" class="d-none"></div>
</div>
<div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mt-3" id="paginationBar">
  <div class="text-muted small" id="pageInfo"></div>
  <div class="btn-group btn-group-sm">
    <button class="btn btn-soft" id="prevPageBtn"><i class="bi bi-chevron-left"></i></button>
    <button class="btn btn-soft" id="nextPageBtn"><i class="bi bi-chevron-right"></i></button>
  </div>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/rbac.js"></script>
<script src="js/main.js"></script>
<script src="js/users.js"></script>
</body>
</html>
