<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Users | Hotel Owner Panel</title>
<link rel="icon" href="data:,">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="app-shell">

<div class="filters-bar">
  <div class="row g-2 align-items-center">
    <div class="col-md-4">
      <div class="search-box w-100" style="max-width:100%"><i class="bi bi-search"></i>
        <input type="text" class="form-control w-100" id="searchInput" placeholder="Search users by name or email...">
      </div>
    </div>
    <div class="col-md-3">
      <select class="form-select" id="roleFilter"><option value="">All Roles</option></select>
    </div>
    <div class="col-md-3">
      <select class="form-select" id="statusFilter">
        <option value="">All Status</option>
        <option value="active">Active</option>
        <option value="inactive">Inactive</option>
      </select>
    </div>
  </div>
</div>

<div id="resultsCount" class="text-muted small mb-2"></div>
<div class="card-surface p-0 overflow-hidden">
  <div class="table-responsive">
    <table class="table-modern w-100">
      <thead><tr>
        <th>User</th><th>Role</th><th>Assigned Properties</th><th>Status</th><th class="text-end">Actions</th>
      </tr></thead>
      <tbody id="usersBody"></tbody>
    </table>
  </div>
  <div id="emptyState" class="d-none"></div>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/rbac.js"></script>
<script src="js/main.js"></script>
<script src="js/users.js"></script>
</body>
</html>
