<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rate Calendar | Hotel Owner Panel</title>
<link rel="icon" href="data:,">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<link href="css/portal.css" rel="stylesheet">
<link href="css/rate-matrix.css" rel="stylesheet">
<style>
  /* This page is always embedded in a fixed-height iframe (see property-details.js's Rate
     Calendar tab) — without this, the iframe's own document could ALSO grow taller than the
     iframe and pick up its own native scrollbar, stacking on top of the price grid's internal
     scroller (.grid-table-wrap) below. Pinning the page to exactly the iframe's height and
     letting only the grid's own wrapper scroll means there is ever only one scroller on screen. */
  html, body{ height:100%; margin:0; overflow:hidden; }
  #app-shell{ display:flex; flex-direction:column; height:100vh; box-sizing:border-box; }
  #app-shell > .cal-toolbar, #app-shell > #parityHint, #app-shell > .cal-actions{ flex:0 0 auto; }
  #app-shell > .cal-grid-card{ flex:1 1 auto; min-height:0; display:flex; flex-direction:column; overflow:hidden; }
  #app-shell > .cal-grid-card #gridHost{ flex:1 1 auto; min-height:0; display:flex; flex-direction:column; }
  #app-shell > .cal-grid-card #gridHost .grid-table-wrap{ flex:1 1 auto; min-height:0; max-height:none; }
</style>
</head>
<body>
<div id="app-shell">

<div class="cal-toolbar">
  <div class="d-flex align-items-center gap-2 flex-wrap">
    <div class="mx-range-segmented" id="mx_rangeSegmented" role="group">
      <button type="button" class="mx-seg-btn" data-preset="7">7D</button>
      <button type="button" class="mx-seg-btn" data-preset="14">14D</button>
      <button type="button" class="mx-seg-btn" data-preset="30">30D</button>
      <div class="dropdown d-inline-block" id="mx_customDropdown">
        <button type="button" class="mx-seg-btn dropdown-toggle" id="mx_customBtn" data-preset="custom" data-bs-toggle="dropdown" data-bs-auto-close="outside">Custom</button>
        <div class="dropdown-menu p-0" id="mx_dateRangeMenu">
          <div class="mx-drp-custom" id="mx_drpCustom">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <button type="button" class="btn btn-sm-icon btn-soft" id="mx_drpPrevMonth"><i class="bi bi-chevron-left"></i></button>
              <div class="d-flex gap-3">
                <div class="fw-semibold small text-center" style="width:200px" id="mx_drpMonthLabel1"></div>
                <div class="fw-semibold small text-center" style="width:200px" id="mx_drpMonthLabel2"></div>
              </div>
              <button type="button" class="btn btn-sm-icon btn-soft" id="mx_drpNextMonth"><i class="bi bi-chevron-right"></i></button>
            </div>
            <div class="d-flex gap-3">
              <div class="mx-drp-cal" id="mx_drpCal1"></div>
              <div class="mx-drp-cal" id="mx_drpCal2"></div>
            </div>
            <div class="d-flex justify-content-between align-items-center mt-2 pt-2 mx-drp-footer">
              <div class="text-muted small" id="mx_drpSelectedLabel">Select a start and end date</div>
              <div class="d-flex gap-2">
                <button type="button" class="btn btn-light btn-sm" id="mx_drpCancel">Cancel</button>
                <button type="button" class="btn btn-primary btn-sm" id="mx_drpApply" disabled>Apply</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <span class="text-muted small" id="mx_dateRangeLabel">-</span>
    <select class="form-select form-select-sm ms-2" id="channelFilter" style="width:auto;min-width:170px"></select>
    <select class="form-select form-select-sm ms-2" id="roomFilter" style="width:auto;min-width:170px"></select>
  </div>
  <div class="d-flex align-items-center gap-2 flex-wrap">
    <button class="btn btn-primary btn-sm" id="btnBulkUpdate" data-bs-toggle="modal" data-bs-target="#bulkModal"><i class="bi bi-sliders me-1"></i>Bulk Update</button>
    <button class="btn btn-outline-primary btn-sm" id="btnUndo" disabled><i class="bi bi-arrow-counterclockwise me-1"></i>Undo</button>
  </div>
</div>

<div class="text-muted small mb-2" id="parityHint"><i class="bi bi-info-circle me-1"></i>Click <img src="https://www.eglobe-solutions.com/channelmanager/images/parity-view.png" alt="Rate Parity" class="parity-icon"> next to any occupancy row to compare its rate against other channels.</div>

<div class="section-card cal-grid-card" style="position:relative">
  <div class="mx-edge-scroll mx-edge-top" id="cal_edgeUp" aria-hidden="true"><i class="bi bi-chevron-up"></i></div>
  <div class="mx-edge-scroll mx-edge-bottom" id="cal_edgeDown" aria-hidden="true"><i class="bi bi-chevron-down"></i></div>
  <div class="mx-edge-scroll mx-edge-left" id="cal_edgeLeft" aria-hidden="true"><i class="bi bi-chevron-left"></i></div>
  <div class="mx-edge-scroll mx-edge-right" id="cal_edgeRight" aria-hidden="true"><i class="bi bi-chevron-right"></i></div>
  <div id="gridHost"></div>
</div>

<div class="d-flex justify-content-end gap-2 mt-3 cal-actions">
  <button class="btn btn-light" id="btnCancelChanges">Cancel Changes</button>
  <button class="btn btn-primary" id="btnSaveChanges" disabled><i class="bi bi-save me-1"></i>Save Changes</button>
</div>

</div>

<!-- Bulk Update Modal -->
<div class="modal fade" id="bulkModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content" style="border-radius:18px;border:none">
      <div class="modal-header border-0">
        <h5 class="modal-title fw-bold"><i class="bi bi-sliders me-2"></i>Bulk Update Rates</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body pt-0">
        <div class="row g-2 mb-3">
          <div class="col-md-4">
            <label class="form-label">Channel</label>
            <select class="form-select" id="bu_channel"><option value="">All Channels</option></select>
          </div>
          <div class="col-md-4">
            <label class="form-label">Room</label>
            <select class="form-select" id="bu_room"><option value="">All Rooms</option></select>
          </div>
          <div class="col-md-4">
            <label class="form-label">Rate Plan</label>
            <select class="form-select" id="bu_ratePlan"><option value="">All Rate Plans</option></select>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Apply To</label>
          <select class="form-select" id="bu_scope">
            <option value="single">Single Date</option>
            <option value="range">Date Range</option>
            <option value="visible">Currently Visible Dates</option>
            <option value="weekdays">Selected Weekdays</option>
            <option value="weekends">Weekends Only (Fri/Sat)</option>
          </select>
        </div>

        <div class="row g-2 mb-3" id="bu_singleWrap">
          <div class="col-md-6">
            <label class="form-label">Date</label>
            <input type="date" class="form-control" id="bu_singleDate">
          </div>
        </div>
        <div class="row g-2 mb-3 d-none" id="bu_rangeWrap">
          <div class="col-md-6"><label class="form-label">From</label><input type="date" class="form-control" id="bu_fromDate"></div>
          <div class="col-md-6"><label class="form-label">To</label><input type="date" class="form-control" id="bu_toDate"></div>
        </div>
        <div class="mb-3 d-none" id="bu_weekdaysWrap">
          <label class="form-label d-block">Weekdays</label>
          <div class="btn-group flex-wrap" role="group" id="bu_weekdayBtns"></div>
          <div class="row g-2 mt-2">
            <div class="col-md-6"><label class="form-label">From</label><input type="date" class="form-control" id="bu_wdFrom"></div>
            <div class="col-md-6"><label class="form-label">To</label><input type="date" class="form-control" id="bu_wdTo"></div>
          </div>
        </div>

        <hr>
        <label class="form-label">Pricing Action</label>
        <div class="row g-2 mb-3">
          <div class="col-md-5">
            <select class="form-select" id="bu_priceAction">
              <option value="fixed">Set Fixed Price</option>
              <option value="incAmt">Increase by Amount</option>
              <option value="decAmt">Decrease by Amount</option>
              <option value="incPct">Increase by %</option>
              <option value="decPct">Decrease by %</option>
              <option value="none">Don't Change Price</option>
            </select>
          </div>
          <div class="col-md-4">
            <input type="number" class="form-control" id="bu_priceValue" placeholder="Value" min="0">
          </div>
          <div class="col-md-3">
            <button class="btn btn-outline-primary w-100" id="bu_clearRates" type="button">Clear Rates</button>
          </div>
        </div>
      </div>
      <div class="modal-footer border-0">
        <button class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-primary" id="bu_apply"><i class="bi bi-check2-circle me-1"></i>Apply Update</button>
      </div>
    </div>
  </div>
</div>

<!-- Rate Parity Modal -->
<div class="modal fade" id="parityModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-xl">
    <div class="modal-content" style="border-radius:18px;border:none">
      <div class="modal-header border-0 pb-0">
        <div>
          <h5 class="modal-title fw-bold mb-1"><img src="https://www.eglobe-solutions.com/channelmanager/images/parity-view.png" alt="Rate Parity" class="parity-icon me-2" style="width:20px;height:20px">Rate Parity Comparison</h5>
          <div class="text-muted small" id="parityMeta">-</div>
        </div>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <!-- Its own date range — independent of whatever range the Rate Calendar behind it is set
             to, so you can widen or narrow the parity comparison without changing the main grid.
             Plain preset buttons + native date pickers so it's easy for anyone, no custom
             calendar widget to figure out. -->
        <div class="parity-range-bar mb-3">
          <span class="parity-range-label"><i class="bi bi-calendar-range me-1"></i>Date Range</span>
          <div class="btn-group btn-group-sm" id="parity_rangeGroup" role="group">
            <button type="button" class="btn btn-soft" data-days="7">7 Days</button>
            <button type="button" class="btn btn-soft" data-days="14">14 Days</button>
            <button type="button" class="btn btn-soft" data-days="30">30 Days</button>
          </div>
          <span class="text-muted small d-none d-md-inline">or pick exact dates</span>
          <input type="date" class="form-control form-control-sm" id="parity_startDate" style="width:auto">
          <span class="text-muted small">to</span>
          <input type="date" class="form-control form-control-sm" id="parity_endDate" style="width:auto">
          <button type="button" class="btn btn-primary btn-sm" id="parity_apply"><i class="bi bi-check2 me-1"></i>Apply</button>
        </div>
        <div class="parity-scroll-wrap">
          <div class="mx-edge-scroll mx-edge-left" id="parity_edgeLeft" aria-hidden="true"><i class="bi bi-chevron-left"></i></div>
          <div class="mx-edge-scroll mx-edge-right" id="parity_edgeRight" aria-hidden="true"><i class="bi bi-chevron-right"></i></div>
          <div id="parityGridHost"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/rbac.js"></script>
<script src="js/main.js"></script>
<script src="js/rate-calendar.js"></script>
</body>
</html>
