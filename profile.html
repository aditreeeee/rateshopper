<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile | Hotel Owner Panel</title>
<link rel="icon" href="data:,">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<link href="css/portal.css" rel="stylesheet">
</head>
<body>
<div id="app-shell">

<div class="row g-3">
  <div class="col-lg-4">
    <div class="section-card p-0 overflow-hidden pf-summary-card">
      <div class="pf-cover"></div>
      <div class="text-center px-3 pb-2">
        <div class="pf-avatar-wrap">
          <img id="pf_avatarPreview" src="" class="pf-avatar">
          <label class="pf-avatar-edit" for="pf_avatarUrl" title="Update photo"><i class="bi bi-camera-fill"></i></label>
        </div>
        <h5 class="fw-bold mb-1" id="pf_nameDisplay"></h5>
        <span class="badge bg-primary-subtle text-primary mb-3" id="pf_roleBadge"></span>

        <div class="pf-avatar-url-field text-start">
          <input type="text" class="form-control form-control-sm" id="pf_avatarUrl" placeholder="Paste an avatar image URL...">
          <small class="text-muted">Save below to update your photo (demo mode — no file upload).</small>
        </div>
      </div>
      <hr class="my-3">
      <div class="text-start px-3 pb-3">
        <div class="kv-row"><span class="k"><i class="bi bi-fingerprint me-2"></i>User ID</span><span class="v" id="pf_hmsUserIdDisplay"></span></div>
        <div class="kv-row"><span class="k"><i class="bi bi-envelope me-2"></i>Email</span><span class="v" id="pf_emailDisplay"></span></div>
        <div class="kv-row"><span class="k"><i class="bi bi-telephone me-2"></i>Phone</span><span class="v" id="pf_phoneDisplay"></span></div>
        <div class="kv-row"><span class="k"><i class="bi bi-calendar3 me-2"></i>Member Since</span><span class="v" id="pf_memberSince"></span></div>
        <div class="kv-row d-none" id="pf_parentRow"><span class="k"><i class="bi bi-house-door me-2"></i>Parent Property</span><span class="v" id="pf_parentValue"></span></div>
        <div class="kv-row d-none" id="pf_competitorsRow"><span class="k"><i class="bi bi-building me-2"></i>Competitor Properties</span><span class="v" id="pf_competitorsValue"></span></div>
      </div>
    </div>
  </div>

  <div class="col-lg-8">
    <form id="profileForm">
      <div class="section-card mb-3">
        <div class="rc-section-title mb-3">
          <span class="rc-section-icon"><i class="bi bi-person-vcard"></i></span>
          <div class="fw-bold">Personal Information</div>
        </div>
        <div class="row g-3">
          <div class="col-md-6"><label class="form-label">Full Name</label><input class="form-control" id="pf_name" required></div>
          <div class="col-md-6"><label class="form-label">Role</label><input class="form-control" id="pf_role" disabled></div>
          <div class="col-md-6"><label class="form-label">Email Address</label><input type="email" class="form-control" id="pf_email" required></div>
          <div class="col-md-6"><label class="form-label">Phone Number</label><input class="form-control" id="pf_phone"></div>
          <div class="col-12"><label class="form-label">Bio</label><textarea class="form-control" rows="3" id="pf_bio" placeholder="A short line about your role or focus..."></textarea></div>
        </div>
      </div>

      <div class="section-card mb-3">
        <div class="rc-section-title mb-3">
          <span class="rc-section-icon" style="background:linear-gradient(135deg,var(--text-3),var(--text-2))"><i class="bi bi-shield-lock"></i></span>
          <div>
            <div class="fw-bold">Change Password</div>
            <div class="text-muted small">Disabled in this frontend-only demo — nothing here is saved.</div>
          </div>
        </div>
        <div class="row g-3">
          <div class="col-md-4"><label class="form-label">Current Password</label><input type="password" class="form-control" placeholder="••••••••" disabled></div>
          <div class="col-md-4"><label class="form-label">New Password</label><input type="password" class="form-control" placeholder="••••••••" disabled></div>
          <div class="col-md-4"><label class="form-label">Confirm New Password</label><input type="password" class="form-control" placeholder="••••••••" disabled></div>
        </div>
      </div>

      <div class="d-flex justify-content-end gap-2">
        <a href="dashboard.html" class="btn btn-light">Cancel</a>
        <button type="submit" class="btn btn-primary"><i class="bi bi-check2-circle me-1"></i>Save Profile</button>
      </div>
    </form>
  </div>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/rbac.js"></script>
<script src="js/main.js"></script>
<script src="js/portal-data.js"></script>
<script src="js/portal-shell.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
