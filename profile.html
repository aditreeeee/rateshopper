<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile | Hotel Owner Panel</title>
<link rel="icon" href="data:,">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="app-shell">

<div class="row g-3">
  <div class="col-lg-4">
    <div class="section-card text-center">
      <img id="pf_avatarPreview" src="" class="rounded-circle mb-3" style="width:110px;height:110px;object-fit:cover;border:4px solid var(--brand-100)">
      <h5 class="fw-bold mb-0" id="pf_nameDisplay"></h5>
      <div class="text-muted small mb-3" id="pf_roleDisplay"></div>
      <input type="text" class="form-control mb-2" id="pf_avatarUrl" placeholder="Avatar image URL">
      <div class="text-muted small">Paste a new avatar URL and save to update your photo (demo mode).</div>
      <hr>
      <div class="text-start">
        <div class="kv-row"><span class="k">Email</span><span class="v" id="pf_emailDisplay"></span></div>
        <div class="kv-row"><span class="k">Phone</span><span class="v" id="pf_phoneDisplay"></span></div>
      </div>
    </div>
  </div>

  <div class="col-lg-8">
    <form id="profileForm">
      <div class="section-card mb-3">
        <div class="section-title mb-3">Personal Information</div>
        <div class="row g-3">
          <div class="col-md-6"><label class="form-label">Full Name</label><input class="form-control" id="pf_name" required></div>
          <div class="col-md-6"><label class="form-label">Role</label><input class="form-control" id="pf_role" disabled></div>
          <div class="col-md-6"><label class="form-label">Email Address</label><input type="email" class="form-control" id="pf_email" required></div>
          <div class="col-md-6"><label class="form-label">Phone Number</label><input class="form-control" id="pf_phone"></div>
          <div class="col-12"><label class="form-label">Bio</label><textarea class="form-control" rows="3" id="pf_bio"></textarea></div>
        </div>
      </div>

      <div class="section-card mb-3">
        <div class="section-title mb-3">Change Password</div>
        <div class="row g-3">
          <div class="col-md-4"><label class="form-label">Current Password</label><input type="password" class="form-control" placeholder="••••••••"></div>
          <div class="col-md-4"><label class="form-label">New Password</label><input type="password" class="form-control" placeholder="••••••••"></div>
          <div class="col-md-4"><label class="form-label">Confirm New Password</label><input type="password" class="form-control" placeholder="••••••••"></div>
        </div>
        <small class="text-muted d-block mt-2"><i class="bi bi-info-circle me-1"></i>Password change is disabled in this frontend-only demo.</small>
      </div>

      <div class="d-flex justify-content-end gap-2">
        <a href="dashboard.html" class="btn btn-light">Cancel</a>
        <button type="submit" class="btn btn-primary"><i class="bi bi-check2-circle me-1"></i>Save Profile</button>
      </div>
    </form>
  </div>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/rbac.js"></script>
<script src="js/main.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
