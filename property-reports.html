<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reports | Rate Shopper IQ</title>
<link rel="icon" href="data:,">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<link href="css/portal.css" rel="stylesheet">
</head>
<body>
<div id="app-shell">

<div class="row g-3 mb-3">
  <div class="col-lg-8">
    <div class="section-card">
      <div class="fw-bold mb-3">Report Type</div>
      <div class="btn-group flex-wrap" id="rp_typeGroup" role="group">
        <button type="button" class="btn btn-outline-primary" data-type="daily">Daily</button>
        <button type="button" class="btn btn-soft" data-type="weekly">Weekly</button>
        <button type="button" class="btn btn-soft" data-type="monthly">Monthly</button>
        <button type="button" class="btn btn-soft" data-type="quarterly">Quarterly</button>
        <button type="button" class="btn btn-soft" data-type="custom">Custom</button>
      </div>
      <div class="row g-2 mt-3 d-none" id="rp_customWrap">
        <div class="col-md-5"><label class="form-label">From</label><input type="date" class="form-control" id="rp_from"></div>
        <div class="col-md-5"><label class="form-label">To</label><input type="date" class="form-control" id="rp_to"></div>
      </div>
    </div>
  </div>
  <div class="col-lg-4">
    <div class="section-card h-100">
      <div class="fw-bold mb-3">Export</div>
      <div class="d-flex flex-column gap-2">
        <button class="btn btn-outline-primary btn-sm" id="rp_pdf"><i class="bi bi-file-earmark-pdf me-1"></i>Export PDF</button>
        <button class="btn btn-outline-primary btn-sm" id="rp_excel"><i class="bi bi-file-earmark-excel me-1"></i>Export Excel</button>
        <button class="btn btn-outline-primary btn-sm" id="rp_csv"><i class="bi bi-filetype-csv me-1"></i>Export CSV</button>
        <button class="btn btn-outline-primary btn-sm" id="rp_print"><i class="bi bi-printer me-1"></i>Print</button>
      </div>
    </div>
  </div>
</div>

<div class="section-card">
  <div class="fw-bold mb-2" id="rp_reportTitle">Daily Report</div>
  <div class="table-responsive"><table class="table-modern w-100" id="rp_table"></table></div>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/rbac.js"></script>
<script src="js/main.js"></script>
<script src="js/portal-data.js"></script>
<script src="js/portal-shell.js"></script>
<script src="js/portal-widgets.js"></script>
<script src="js/property-reports.js"></script>
</body>
</html>
