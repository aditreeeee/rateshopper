<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications | Hotel Owner Panel</title>
<link rel="icon" href="data:,">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="app-shell">

<div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
  <div class="btn-group">
    <button class="btn btn-soft active" data-filter="all">All</button>
    <button class="btn btn-outline-primary" data-filter="unread">Unread</button>
  </div>
  <button class="btn btn-light btn-sm" id="markAllBtn"><i class="bi bi-check2-all me-1"></i>Mark all as read</button>
</div>

<div class="section-card p-0" id="notifWrap">
  <div id="notifListFull"></div>
  <div id="notifEmpty" class="d-none"></div>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/rbac.js"></script>
<script src="js/main.js"></script>
<script src="js/notifications.js"></script>
</body>
</html>
