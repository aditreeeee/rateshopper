


<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Channel Analysis | Rate Shopper IQ</title>
<link rel="icon" href="data:,">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<link href="css/portal.css" rel="stylesheet">
</head>
<body>
<div id="app-shell">

<div class="row g-3 mb-3" id="channelCards"></div>

<div class="chart-card mb-3">
  <div class="fw-bold mb-2">Current Rate by Channel</div>
  <canvas id="channelRateChart" height="90"></canvas>
</div>

<div class="section-card p-0">
  <div class="p-3 pb-0">
    <div class="fw-bold">Channels Display — Room / Rate Plan Parity</div>
    <div class="text-muted small mb-2">Direct (Master Channel) vs. every OTA (or just the one you pick below), for today, across every room in the property.</div>
    <div class="row g-2 mb-3">
      <div class="col-6 col-md-3">
        <select class="form-select form-select-sm" id="ca_room"><option value="">All Rooms</option></select>
      </div>
      <div class="col-6 col-md-3">
        <select class="form-select form-select-sm" id="ca_channel"><option value="">All Channels (OTA Avg.)</option></select>
      </div>
    </div>
  </div>
  <div class="table-responsive">
    <table class="table-modern w-100" id="parityTable"></table>
  </div>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="js/data.js"></script>
<script src="js/rbac.js"></script>
<script src="js/main.js"></script>
<script src="js/portal-data.js"></script>
<script src="js/portal-shell.js"></script>
<script src="js/portal-widgets.js"></script>
<script src="js/property-channel-analysis.js"></script>
</body>
</html>
