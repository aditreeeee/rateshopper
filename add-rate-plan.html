<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Rate Plan | Hotel Owner Panel</title>
<link rel="icon" href="data:,">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="app-shell">

<form id="rpForm">
<div class="row g-3">
  <div class="col-lg-8">
    <div class="section-card mb-3">
      <div class="section-title mb-3">Rate Plan Details</div>
      <div class="row g-3">
        <div class="col-md-4">
          <label class="form-label">Property *</label>
          <select class="form-select" id="f_property" required></select>
        </div>
        <div class="col-md-4">
          <label class="form-label">Channel *</label>
          <select class="form-select" id="f_channel" required></select>
        </div>
        <div class="col-md-4">
          <label class="form-label">Room Type *</label>
          <select class="form-select" id="f_room" required></select>
        </div>
        <div class="col-12">
          <label class="form-label">Rate Plan Name *</label>
          <input type="text" class="form-control" id="f_name" required placeholder="e.g. Deluxe Room - CP Flexible">
        </div>
        <div class="col-md-6">
          <label class="form-label">Meal Plan *</label>
          <select class="form-select" id="f_meal" required>
            <option value="EP">EP — European Plan (Room Only)</option>
            <option value="CP">CP — Continental Plan (+ Breakfast)</option>
            <option value="MAP">MAP — Modified American Plan (+ 1 Meal)</option>
            <option value="AP">AP — American Plan (All Meals)</option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label">Refund Policy *</label>
          <select class="form-select" id="f_refundable" required>
            <option value="true">Refundable</option>
            <option value="false">Non-Refundable</option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label">Minimum Stay (nights) *</label>
          <input type="number" class="form-control" id="f_minStay" value="1" min="1" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Maximum Stay (nights) *</label>
          <input type="number" class="form-control" id="f_maxStay" value="14" min="1" required>
        </div>
        <div class="col-12">
          <label class="form-label">Cancellation Policy *</label>
          <textarea class="form-control" id="f_cancellation" rows="3" required placeholder="Describe the cancellation policy..."></textarea>
        </div>
      </div>
    </div>

    <div class="section-card">
      <div class="section-title mb-3">Occupancy Pricing</div>
      <div class="row g-3">
        <div class="col-md-4">
          <label class="form-label">Base Occupancy (guests)</label>
          <input type="number" class="form-control" id="f_baseOcc" value="2" min="1">
        </div>
        <div class="col-md-4">
          <label class="form-label">Extra Adult Price</label>
          <input type="number" class="form-control" id="f_extraAdult" value="800" min="0">
        </div>
        <div class="col-md-4">
          <label class="form-label">Extra Child Price</label>
          <input type="number" class="form-control" id="f_extraChild" value="400" min="0">
        </div>
      </div>
    </div>
  </div>

  <div class="col-lg-4">
    <div class="section-card mb-3">
      <div class="section-title mb-3">Status</div>
      <select class="form-select" id="f_status">
        <option value="active">Active</option>
        <option value="inactive">Inactive</option>
      </select>
      <div class="alert alert-info small mt-3 mb-0" style="border-radius:12px">
        <i class="bi bi-info-circle me-1"></i> Once saved, use the <strong>Rate Calendar</strong> to set day-by-day pricing for this plan.
      </div>
    </div>
    <div class="section-card">
      <div class="section-title mb-2">Save Rate Plan</div>
      <button type="submit" class="btn btn-primary w-100 mb-2"><i class="bi bi-check2-circle me-1"></i><span id="submitLabel">Save Rate Plan</span></button>
      <a href="properties.html" id="cancelBtn" class="btn btn-light w-100">Cancel</a>
    </div>
  </div>
</div>
</form>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/rbac.js"></script>
<script src="js/main.js"></script>
<script src="js/add-rate-plan.js"></script>
</body>
</html>
