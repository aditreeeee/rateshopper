<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rate Intelligence Dashboard | Rate Shopper IQ</title>
<link rel="icon" href="data:,">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<link href="css/portal.css" rel="stylesheet">
</head>
<body>
<div id="app-shell">

<div class="market-snapshot-bar" id="marketSnapshotBar"></div>

<div class="row g-3 mb-1" id="kpiPrimary"></div>
<div class="row g-3 mt-1" id="kpiSecondary"></div>

<div class="row g-3 mt-1">
  <div class="col-xxl-8">
    <div class="fw-bold mb-2 mt-1">Dashboard Charts</div>
    <div class="chart-card mb-3">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <div class="rc-section-title mb-0">
          <span class="rc-section-icon"><i class="bi bi-graph-up-arrow"></i></span>
          <div>
            <div class="fw-bold">My Rate vs. Market Average</div>
            <div class="text-muted small">Last 30 days vs. next 30 days</div>
          </div>
        </div>
      </div>
      <canvas id="rateTrendChart" height="90"></canvas>
    </div>

    <div class="row g-3 mb-3">
      <div class="col-md-6">
        <div class="chart-card h-100">
          <div class="rc-section-title mb-2"><span class="rc-section-icon"><i class="bi bi-table"></i></span><div class="fw-bold">Competitor Comparison</div></div>
          <div class="table-responsive"><table class="table-modern w-100" id="competitorComparisonTable"></table></div>
        </div>
      </div>
      <div class="col-md-6">
        <div class="chart-card h-100">
          <div class="rc-section-title mb-2"><span class="rc-section-icon"><i class="bi bi-bar-chart-steps"></i></span><div class="fw-bold">Rate Distribution</div></div>
          <canvas id="priceDistChart" height="140"></canvas>
        </div>
      </div>
    </div>

    <div class="chart-card mb-3">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <div class="rc-section-title mb-0"><span class="rc-section-icon"><i class="bi bi-graph-up"></i></span><div class="fw-bold">Price Trends</div></div>
        <div class="btn-group btn-group-sm" id="trendTabGroup" role="group">
          <button type="button" class="btn btn-outline-primary" data-range="daily">Daily</button>
          <button type="button" class="btn btn-soft" data-range="weekly">Weekly</button>
          <button type="button" class="btn btn-soft" data-range="monthly">Monthly</button>
        </div>
      </div>
      <canvas id="priceTrendChart" height="90"></canvas>
    </div>

    <div class="section-card mb-3">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <div class="rc-section-title mb-0"><span class="rc-section-icon"><i class="bi bi-calendar3"></i></span><div class="fw-bold">Price Calendar</div></div>
        <div class="btn-group btn-group-sm" id="priceCalRangeGroup" role="group">
          <button type="button" class="btn btn-soft" data-days="7">7D</button>
          <button type="button" class="btn btn-outline-primary" data-days="14">14D</button>
          <button type="button" class="btn btn-soft" data-days="30">30D</button>
        </div>
      </div>
      <div class="table-responsive">
        <table class="table-modern w-100" id="priceCalendarTable"></table>
      </div>
    </div>

    <div class="section-card d-flex align-items-center justify-content-between flex-wrap gap-2">
      <div class="text-muted small"><i class="bi bi-signpost-split me-1"></i>Ready to dig into individual rooms and rate plans?</div>
      <a href="property-room-comparison.html" class="btn btn-outline-primary btn-sm">Next: Analysis <i class="bi bi-arrow-right ms-1"></i></a>
    </div>
  </div>

  <div class="col-xxl-4">
    <div class="section-card mb-3">
      <div class="rc-section-title mb-2"><span class="rc-section-icon"><i class="bi bi-speedometer"></i></span><div class="fw-bold">Rate Position</div></div>
      <div id="ratePositionWidget"></div>
    </div>

    <div class="section-card mb-3">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <div class="rc-section-title mb-0"><span class="rc-section-icon"><i class="bi bi-trophy"></i></span><div class="fw-bold">Competitor Leaderboard</div></div>
        <a href="property-competitors.html" class="small">View all</a>
      </div>
      <div id="leaderboardWidget"></div>
    </div>

    <div class="section-card">
      <div class="rc-section-title mb-2"><span class="rc-section-icon"><i class="bi bi-diagram-3-fill"></i></span><div class="fw-bold">Channel Performance</div></div>
      <div id="channelPerfWidget"></div>
    </div>
  </div>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="js/data.js"></script>
<script src="js/rbac.js"></script>
<script src="js/main.js"></script>
<script src="js/portal-data.js"></script>
<script src="js/portal-shell.js"></script>
<script src="js/portal-widgets.js"></script>
<script src="js/property-dashboard.js"></script>
</body>
</html>
