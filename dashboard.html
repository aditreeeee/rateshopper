<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Company Dashboard | Hotel Owner Panel</title>
<link rel="icon" href="data:,">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<link href="css/dashboard-premium.css" rel="stylesheet">
</head>
<body>
<div id="app-shell" class="company-dashboard">

<!-- Quick Actions — a slim toolbar up top so secondary/bulk admin actions are one click away
     without scrolling. The one primary action (Add Property) stays in the page header. -->
<div class="qa-headbar mb-3" id="quickActions">
  <span class="qa-headbar-label"><i class="bi bi-lightning-charge-fill"></i>Quick Actions</span>
  <div class="qa-headbar-actions">
    <a href="add-user.html" id="qaAddUser" class="qa-chip"><i class="bi bi-person-plus"></i>Add User</a>
    <a href="add-user.html" id="qaAssignOwner" class="qa-chip"><i class="bi bi-person-check"></i>Assign Property Owner</a>
    <a href="users.html" id="qaAssignCompetitors" class="qa-chip"><i class="bi bi-signpost-split"></i>Assign Competitors</a>
    <button type="button" id="qaImport" class="qa-chip"><i class="bi bi-upload"></i>Import Properties</button>
    <button type="button" id="qaExport" class="qa-chip"><i class="bi bi-download"></i>Export Properties</button>
  </div>
</div>

<!-- KPI Cards -->
<div class="row g-3" id="kpiCards"></div>
<!-- Property Health -->
<div class="section-card mt-3">
  <div class="d-flex justify-content-between align-items-start mb-3 flex-wrap gap-2">
    <div class="d-flex align-items-start gap-2">
      <span class="section-icon"><i class="bi bi-clipboard2-pulse"></i></span>
      <div>
        <div class="section-title">Property Health</div>
        <div class="section-sub">Owner assignment, competitor coverage, and configuration completeness per property</div>
      </div>
    </div>
  </div>
  <div class="row g-2 mb-2">
    <div class="col-md-5">
      <div class="search-box w-100" style="max-width:100%"><i class="bi bi-search"></i>
        <input type="text" class="form-control w-100" id="ph_search" placeholder="Search properties by name or city...">
      </div>
    </div>
    <div class="col-6 col-md-3">
      <select class="form-select" id="ph_status">
        <option value="">All Health Status</option>
        <option value="healthy">Healthy</option>
        <option value="attention">Needs Attention</option>
        <option value="incomplete">Incomplete</option>
      </select>
    </div>
    <div class="col-6 col-md-4">
      <select class="form-select" id="ph_owner">
        <option value="">All Ownership</option>
        <option value="assigned">Owner Assigned</option>
        <option value="unassigned">No Owner Assigned</option>
      </select>
    </div>
  </div>
  <div id="ph_count" class="text-muted small mb-2"></div>
  <div class="card-surface p-0 overflow-hidden">
    <div class="table-responsive table-sticky-wrap">
      <table class="table-modern w-100">
        <thead><tr>
          <th>Property</th><th>Assigned Owner</th><th class="text-center">Competitors</th>
          <th class="text-center">Channels</th><th class="text-center">Rooms</th><th class="text-center">Rate Plans</th>
          <th>Setup Progress</th><th>Status</th>
        </tr></thead>
        <tbody id="propertyHealthBody"></tbody>
      </table>
    </div>
    <div id="ph_empty" class="d-none"></div>
  </div>
</div>

<!-- Recent Activity -->
<div class="section-card mt-3">
  <div class="d-flex align-items-center gap-2 mb-3">
    <span class="section-icon"><i class="bi bi-clock-history"></i></span>
    <div class="section-title mb-0">Recent Activity</div>
  </div>
  <div class="nice-scroll" style="max-height:320px" id="activityTimeline"></div>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="js/data.js"></script>
<script src="js/rbac.js"></script>
<script src="js/main.js"></script>
<script src="js/global-search.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
