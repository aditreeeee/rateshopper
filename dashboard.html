<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard | Hotel Owner Panel</title>
<link rel="icon" href="data:,">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<link href="css/portal.css" rel="stylesheet">
</head>
<body>
<div id="app-shell">
<div class="row g-3 mb-1" id="statCards"></div>

<div class="row g-3 mt-1">
  <div class="col-xxl-8">
    <div class="section-card mb-3">
      <div class="d-flex justify-content-between align-items-start mb-3 flex-wrap gap-2">
        <div>
          <div class="section-title">Revenue Overview</div>
          <div class="section-sub">Last 12 months performance across all properties</div>
        </div>
        <div class="btn-group btn-group-sm">
          <button class="btn btn-soft active" data-range="12m">12M</button>
          <button class="btn btn-outline-primary" data-range="6m">6M</button>
          <button class="btn btn-outline-primary" data-range="30d">30D</button>
        </div>
      </div>
      <canvas id="revenueChart" height="110"></canvas>
    </div>

    <div class="section-card">
      <div class="section-title mb-1">Occupancy Trend</div>
      <div class="section-sub mb-3">Occupancy % across all properties</div>
      <canvas id="occupancyChart" height="90"></canvas>
    </div>
  </div>

  <div class="col-xxl-4">
    <div class="section-card mb-3">
      <div class="section-title mb-3">Quick Actions</div>
      <div class="d-grid gap-2" id="quickActions">
        <a href="add-property.html" id="qaAddProperty" class="btn btn-soft text-start"><i class="bi bi-plus-circle me-2"></i>Add New Property</a>
        <a href="add-room.html" id="qaAddRoom" class="btn btn-soft text-start"><i class="bi bi-door-open me-2"></i>Add Room Type</a>
        <a href="add-rate-plan.html" id="qaAddRatePlan" class="btn btn-soft text-start"><i class="bi bi-tags me-2"></i>Create Rate Plan</a>
        <a href="properties.html" id="qaRateCalendar" class="btn btn-primary text-start"><i class="bi bi-calendar3-range me-2"></i>Open a Property's Rate Calendar</a>
      </div>
    </div>

    <div class="section-card mb-3">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <div class="section-title mb-0">Calendar</div>
        <small class="text-muted" id="miniCalMonth"></small>
      </div>
      <div class="mini-calendar" id="miniCalendar"></div>
    </div>

    <div class="section-card">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <div class="section-title mb-0">Notifications</div>
        <a href="notifications.html" class="small">View all</a>
      </div>
      <div class="nice-scroll" id="notifList"></div>
    </div>
  </div>
</div>

<div class="row g-3 mt-1">
  <div class="col-12">
    <div class="section-card">
      <div class="section-title mb-3">Recent Activity</div>
      <div id="activityList"></div>
    </div>
  </div>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="js/data.js"></script>
<script src="js/rbac.js"></script>
<script src="js/main.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
