<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Property | Hotel Owner Panel</title>
<link rel="icon" href="data:,">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="app-shell">

<form id="propertyForm">
<div class="row g-3">
  <div class="col-lg-8">
    <div class="section-card mb-3">
      <div class="section-title mb-3">Basic Information</div>
      <div class="row g-3">
        <div class="col-md-8">
          <label class="form-label">Property Name *</label>
          <input type="text" class="form-control" id="f_name" required placeholder="e.g. Grand Horizon Resort">
        </div>
        <div class="col-md-4">
          <label class="form-label">Property Type *</label>
          <select class="form-select" id="f_type" required>
            <option value="Resort">Resort</option>
            <option value="Business Hotel">Business Hotel</option>
            <option value="Heritage Hotel">Heritage Hotel</option>
            <option value="Boutique Hotel">Boutique Hotel</option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label">Country *</label>
          <input type="text" class="form-control" id="f_country" required placeholder="e.g. India" list="countryList">
          <datalist id="countryList"></datalist>
        </div>
        <div class="col-md-4">
          <label class="form-label">City *</label>
          <input type="text" class="form-control" id="f_city" required placeholder="e.g. Goa">
        </div>
        <div class="col-md-4">
          <label class="form-label">Star Rating</label>
          <select class="form-select" id="f_stars">
            <option value="3">3 Star</option>
            <option value="4">4 Star</option>
            <option value="5" selected>5 Star</option>
          </select>
        </div>
        <div class="col-12">
          <label class="form-label">Full Address *</label>
          <textarea class="form-control" id="f_address" rows="2" required placeholder="Street, area, city, pincode"></textarea>
        </div>
        <div class="col-12">
          <label class="form-label">Description</label>
          <textarea class="form-control" id="f_description" rows="3" placeholder="Brief description of the property..."></textarea>
        </div>
      </div>
    </div>

    <div class="section-card mb-3">
      <div class="section-title mb-3">Contact Details</div>
      <div class="row g-3">
        <div class="col-md-4">
          <label class="form-label">Phone Number *</label>
          <input type="tel" class="form-control" id="f_phone" required placeholder="+91 9876543210">
        </div>
        <div class="col-md-4">
          <label class="form-label">Email Address *</label>
          <input type="email" class="form-control" id="f_email" required placeholder="contact@hotel.com">
        </div>
        <div class="col-md-4">
          <label class="form-label">Website</label>
          <input type="text" class="form-control" id="f_website" placeholder="www.hotel.com">
        </div>
        <div class="col-md-6">
          <label class="form-label">Total Rooms</label>
          <input type="number" class="form-control" id="f_rooms" min="1" value="50">
        </div>
        <div class="col-md-6">
          <label class="form-label">Status</label>
          <select class="form-select" id="f_status">
            <option value="active">Active</option>
            <option value="inactive">Inactive</option>
          </select>
        </div>
      </div>
    </div>

    <div class="section-card">
      <div class="section-title mb-3">Amenities</div>
      <div class="row g-2" id="amenitiesGrid">
        ${''}
      </div>
    </div>
  </div>

  <div class="col-lg-4">
    <div class="section-card mb-3">
      <div class="section-title mb-3">Property Logo / Cover</div>
      <div class="text-center mb-3">
        <img id="logoPreview" src="https://images.unsplash.com/photo-1566073771259-6a8506099945?w=400&q=60" class="logo-preview">
      </div>
      <div class="upload-drop" onclick="document.getElementById('logoUrlInput').focus()">
        <i class="bi bi-cloud-arrow-up d-block mb-2" style="font-size:1.6rem"></i>
        <small>Paste an image URL below (demo mode — no file upload)</small>
      </div>
      <input type="text" class="form-control mt-2" id="logoUrlInput" placeholder="https://... image URL">
    </div>

    <div class="section-card">
      <div class="section-title mb-2">Save Property</div>
      <p class="text-muted small">Review the details before saving. You can edit this property anytime.</p>
      <button type="submit" class="btn btn-primary w-100 mb-2"><i class="bi bi-check2-circle me-1"></i><span id="submitLabel">Save Property</span></button>
      <a href="properties.html" class="btn btn-light w-100">Cancel</a>
    </div>
  </div>
</div>
</form>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/rbac.js"></script>
<script src="js/main.js"></script>
<script src="js/add-property.js"></script>
</body>
</html>
