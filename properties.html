<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Properties | Hotel Owner Panel</title>
<link rel="icon" href="data:,">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="app-shell">

<div class="filters-bar">
  <div class="row g-2 align-items-center mb-2">
    <div class="col-md-4">
      <div class="search-box w-100" style="width:100% !important;max-width:100%">
        <i class="bi bi-search"></i>
        <input type="text" class="form-control w-100" id="searchInput" placeholder="Search properties by name or city...">
      </div>
    </div>
    <div class="col-md-2">
      <select class="form-select" id="countryFilter"><option value="">All Countries</option></select>
    </div>
    <div class="col-md-2">
      <select class="form-select" id="cityFilter"><option value="">All Cities</option></select>
    </div>
    <div class="col-md-2">
      <select class="form-select" id="typeFilter">
        <option value="">All Types</option>
      </select>
    </div>
    <div class="col-md-2">
      <select class="form-select" id="statusFilter">
        <option value="">All Status</option>
        <option value="active">Active</option>
        <option value="inactive">Inactive</option>
      </select>
    </div>
  </div>
  <div class="row g-2 align-items-center">
    <div class="col-md-8">
      <button class="btn btn-light btn-sm" id="resetFiltersBtn"><i class="bi bi-x-circle me-1"></i>Reset Filters</button>
    </div>
    <div class="col-md-2">
      <select class="form-select" id="sortBy">
        <option value="name">Sort: Name (A-Z)</option>
        <option value="rooms">Sort: Rooms</option>
        <option value="stars">Sort: Star Rating</option>
        <option value="newest">Sort: Newest</option>
      </select>
    </div>
    <div class="col-md-2 d-flex gap-2 justify-content-end">
      <button class="btn icon-btn" id="viewGrid" title="Grid view"><i class="bi bi-grid-3x3-gap"></i></button>
      <button class="btn icon-btn" id="viewList" title="List view"><i class="bi bi-list-ul"></i></button>
    </div>
  </div>
</div>

<div id="resultsCount" class="text-muted small mb-2"></div>
<div id="propertyGrid" class="row g-3"></div>
<div id="emptyState" class="d-none"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/rbac.js"></script>
<script src="js/main.js"></script>
<script src="js/properties.js"></script>
</body>
</html>
