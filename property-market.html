<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Market Intelligence | Rate Shopper IQ</title>
<link rel="icon" href="data:,">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<link href="css/portal.css" rel="stylesheet">
</head>
<body>
<div id="app-shell">

<div class="row g-3 mb-1" id="marketKpis"></div>

<div class="row g-3 mt-1">
  <div class="col-xxl-8">
    <div class="chart-card mb-3">
      <div class="fw-bold mb-2">Market Trend — 60 Days</div>
      <canvas id="marketTrendChart" height="90"></canvas>
    </div>
    <div class="chart-card mb-3">
      <div class="fw-bold mb-2">Price Distribution</div>
      <canvas id="marketDistChart" height="100"></canvas>
    </div>
    <div class="section-card">
      <div class="fw-bold mb-2">Competitor Movement</div>
      <div class="table-responsive"><table class="table-modern w-100" id="movementTable"></table></div>
    </div>
  </div>
  <div class="col-xxl-4">
    <div class="section-card mb-3">
      <div class="fw-bold mb-2">Market Summary</div>
      <div id="marketSummary"></div>
    </div>
    <div class="section-card">
      <div class="fw-bold mb-2">New Listings</div>
      <div id="newListings"></div>
    </div>
  </div>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="js/data.js"></script>
<script src="js/rbac.js"></script>
<script src="js/main.js"></script>
<script src="js/portal-data.js"></script>
<script src="js/portal-shell.js"></script>
<script src="js/portal-widgets.js"></script>
<script src="js/property-market.js"></script>
</body>
</html>
