<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings | Hotel Owner Panel</title>
<link rel="icon" href="data:,">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="app-shell">

<div class="row g-3">
  <div class="col-lg-3">
    <div class="section-card p-2">
      <div class="nav flex-column nav-pills" id="settingsTabs">
        <button class="nav-link active text-start" data-tab="company"><i class="bi bi-building me-2"></i>Company Information</button>
        <button class="nav-link text-start" data-tab="currency"><i class="bi bi-currency-exchange me-2"></i>Currency & Taxes</button>
        <button class="nav-link text-start" data-tab="notif"><i class="bi bi-bell me-2"></i>Notifications</button>
        <button class="nav-link text-start" data-tab="prefs"><i class="bi bi-sliders me-2"></i>Preferences</button>
      </div>
    </div>
  </div>

  <div class="col-lg-9">
    <form id="settingsForm">
    <div id="tab-company">
      <div class="section-card">
        <div class="section-title mb-3">Company Information</div>
        <div class="row g-3">
          <div class="col-md-6"><label class="form-label">Company Name</label><input class="form-control" id="s_companyName"></div>
          <div class="col-md-6"><label class="form-label">Company Email</label><input type="email" class="form-control" id="s_companyEmail"></div>
          <div class="col-md-6"><label class="form-label">Company Phone</label><input class="form-control" id="s_companyPhone"></div>
          <div class="col-md-6"><label class="form-label">Timezone</label><input class="form-control" id="s_timezone"></div>
          <div class="col-12"><label class="form-label">Company Address</label><textarea class="form-control" rows="2" id="s_companyAddress"></textarea></div>
        </div>
      </div>
    </div>

    <div id="tab-currency" class="d-none">
      <div class="section-card">
        <div class="section-title mb-3">Currency & Taxes</div>
        <div class="row g-3">
          <div class="col-md-4">
            <label class="form-label">Currency</label>
            <select class="form-select" id="s_currency">
              <option value="INR">Indian Rupee (INR)</option>
              <option value="USD">US Dollar (USD)</option>
              <option value="EUR">Euro (EUR)</option>
              <option value="GBP">British Pound (GBP)</option>
            </select>
          </div>
          <div class="col-md-4"><label class="form-label">Currency Symbol</label><input class="form-control" id="s_currencySymbol"></div>
          <div class="col-md-4"><label class="form-label">Date Format</label>
            <select class="form-select" id="s_dateFormat"><option>DD/MM/YYYY</option><option>MM/DD/YYYY</option><option>YYYY-MM-DD</option></select>
          </div>
          <div class="col-md-6"><label class="form-label">Tax Rate (%)</label><input type="number" class="form-control" id="s_taxRate"></div>
          <div class="col-md-6"><label class="form-label">Service Charge (%)</label><input type="number" class="form-control" id="s_serviceCharge"></div>
        </div>
      </div>
    </div>

    <div id="tab-notif" class="d-none">
      <div class="section-card">
        <div class="section-title mb-3">Notification Preferences</div>
        <div class="form-check form-switch py-2"><input class="form-check-input" type="checkbox" id="s_notifyBooking"><label class="form-check-label">New booking alerts</label></div>
        <div class="form-check form-switch py-2"><input class="form-check-input" type="checkbox" id="s_notifyCancellation"><label class="form-check-label">Cancellation alerts</label></div>
        <div class="form-check form-switch py-2"><input class="form-check-input" type="checkbox" id="s_notifyRateChange"><label class="form-check-label">Rate change alerts</label></div>
      </div>
    </div>

    <div id="tab-prefs" class="d-none">
      <div class="section-card">
        <div class="section-title mb-3">Preferences</div>
        <label class="form-label d-block mb-2">Theme</label>
        <div class="btn-group mb-3">
          <button type="button" class="btn btn-soft" id="prefLight"><i class="bi bi-sun me-1"></i>Light</button>
          <button type="button" class="btn btn-outline-primary" id="prefDark"><i class="bi bi-moon-stars me-1"></i>Dark</button>
        </div>
        <div class="alert alert-info small" style="border-radius:12px"><i class="bi bi-info-circle me-1"></i>More preference options (language, week start day) coming soon.</div>
      </div>
    </div>

    <div class="d-flex justify-content-end gap-2 mt-3">
      <button type="button" class="btn btn-light" onclick="location.reload()">Reset</button>
      <button type="submit" class="btn btn-primary"><i class="bi bi-check2-circle me-1"></i>Save Settings</button>
    </div>
    </form>
  </div>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/rbac.js"></script>
<script src="js/main.js"></script>
<script src="js/settings.js"></script>
</body>
</html>
