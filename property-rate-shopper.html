<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rate Shopper | Rate Shopper IQ</title>
<link rel="icon" href="data:,">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<link href="css/portal.css" rel="stylesheet">
</head>
<body>
<div id="app-shell">

<div class="d-flex justify-content-between align-items-center mb-2 flex-wrap gap-2">
  <div class="text-muted small" id="rs_tickerCaption">-</div>
  <div id="rs_staleBadge"></div>
</div>
<div class="row g-2 mb-3" id="tickerRow"></div>
<div id="rs_emptyState" class="d-none"></div>

<div id="rs_dataSections">
<div class="ticker-chart-card mb-3">
  <div class="d-flex justify-content-between align-items-center mb-2 flex-wrap gap-2">
    <div class="rc-section-title">
      <span class="rc-section-icon"><i class="bi bi-graph-up-arrow"></i></span>
      <div>
        <div class="fw-bold">Rate Comparison</div>
        <div class="text-muted small">My Property vs. every benchmark property, on the Direct (Master) channel — tracked like a market index</div>
      </div>
    </div>
    <div class="d-flex align-items-center gap-2 flex-wrap">
      <div class="btn-group btn-group-sm" id="rs_rangeGroup" role="group">
        <button type="button" class="btn btn-soft" data-days="7">7D</button>
        <button type="button" class="btn btn-outline-primary" data-days="30">30D</button>
        <button type="button" class="btn btn-soft" data-days="90">90D</button>
      </div>
      <div id="rs_legendToggles" class="d-flex flex-wrap gap-1"></div>
    </div>
  </div>
  <canvas id="rs_chart" height="90"></canvas>
</div>

<div class="rc-section-title mb-2">
  <span class="rc-section-icon"><i class="bi bi-grid-3x3-gap-fill"></i></span>
  <div>
    <div class="fw-bold">Rate Matrix</div>
    <div class="text-muted small">Your rate vs. every mapped competitor room, side by side across a date range.</div>
  </div>
</div>
<div class="section-card p-0 rs-matrix-frame-card">
  <iframe id="rs_matrixFrame" src="" scrolling="no" style="width:100%;height:1230px;border:none;display:block;overflow:hidden"></iframe>
</div>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="js/data.js"></script>
<script src="js/rbac.js"></script>
<script src="js/main.js"></script>
<script src="js/portal-data.js"></script>
<script src="js/portal-shell.js"></script>
<script src="js/portal-widgets.js"></script>
<script src="js/property-rate-shopper.js"></script>
</body>
</html>
