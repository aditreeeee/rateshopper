<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rate Shopper | Rate Shopper IQ</title>
<link rel="icon" href="data:,">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<link href="css/portal.css" rel="stylesheet">
</head>
<body>
<div id="app-shell">

<div class="d-flex justify-content-between align-items-center mb-2 flex-wrap gap-2">
  <div class="text-muted small" id="rs_tickerCaption">-</div>
</div>
<div class="row g-2 mb-3" id="tickerRow"></div>

<div class="ticker-chart-card mb-3">
  <div class="d-flex justify-content-between align-items-center mb-2 flex-wrap gap-2">
    <div>
      <div class="fw-bold">Rate Comparison</div>
      <div class="text-muted small">My Property vs. every benchmark property, on the Direct (Master) channel — tracked like a market index</div>
    </div>
    <div class="d-flex align-items-center gap-2 flex-wrap">
      <div class="btn-group btn-group-sm" id="rs_rangeGroup" role="group">
        <button type="button" class="btn btn-soft" data-days="7">7D</button>
        <button type="button" class="btn btn-outline-primary" data-days="30">30D</button>
        <button type="button" class="btn btn-soft" data-days="90">90D</button>
      </div>
      <div id="rs_legendToggles" class="d-flex flex-wrap gap-1"></div>
    </div>
  </div>
  <canvas id="rs_chart" height="90"></canvas>
</div>

<div class="filters-bar">
  <div class="row g-2 align-items-center">
    <div class="col-md-3">
      <label class="form-label mb-1" style="font-size:.72rem" for="rs_date">Rate Date <i class="bi bi-info-circle text-muted" title="The stay date every rate on this page — tickers, chart, and table — is priced for."></i></label>
      <input type="date" class="form-control" id="rs_date">
    </div>
    <div class="col-md-3">
      <label class="form-label mb-1" style="font-size:.72rem" for="rs_channel">Channel <i class="bi bi-info-circle text-muted" title="Which channel the Competitor Rate column is priced on. Your own My Rate is always your Direct (Master) channel rate."></i></label>
      <select class="form-select" id="rs_channel"><option value="">All Channels (each competitor's own primary channel)</option></select>
    </div>
    <div class="col-md-3">
      <label class="form-label mb-1" style="font-size:.72rem" for="rs_status">Status</label>
      <select class="form-select" id="rs_status">
        <option value="">All Status</option>
        <option value="cheaper">Cheaper Than Me</option>
        <option value="pricier">Pricier Than Me</option>
        <option value="parity">At Parity</option>
      </select>
    </div>
    <div class="col-md-3">
      <label class="form-label mb-1" style="font-size:.72rem" for="rs_search">Search</label>
      <input type="text" class="form-control" id="rs_search" placeholder="Search competitor...">
    </div>
  </div>
</div>

<div class="d-flex justify-content-between align-items-center mb-2 flex-wrap gap-2">
  <div class="text-muted small" id="rs_summary">-</div>
  <div class="d-flex gap-2">
    <div class="btn-group btn-group-sm">
      <button class="btn btn-soft" id="rs_pinnedOnly"><i class="bi bi-pin-angle me-1"></i>Pinned Only</button>
    </div>
    <button class="btn btn-outline-primary btn-sm" id="rs_export"><i class="bi bi-download me-1"></i>Export</button>
  </div>
</div>

<div class="section-card p-0">
  <div class="rate-shopper-table-wrap">
    <table class="table-modern w-100" id="rateShopperTable"></table>
  </div>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="js/data.js"></script>
<script src="js/rbac.js"></script>
<script src="js/main.js"></script>
<script src="js/portal-data.js"></script>
<script src="js/portal-shell.js"></script>
<script src="js/portal-widgets.js"></script>
<script src="js/property-rate-shopper.js"></script>
</body>
</html>
