<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Competitors | Rate Shopper IQ</title>
<link rel="icon" href="data:,">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<link href="css/portal.css" rel="stylesheet">
<link href="css/room-mapping.css" rel="stylesheet">
</head>
<body>
<div id="app-shell">

<div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-2">
  <div class="rc-section-title mb-0">
    <span class="rc-section-icon"><i class="bi bi-building"></i></span>
    <div>
      <div class="fw-bold">Competitor Directory</div>
      <div class="text-muted small">Every benchmark property your Company Admin has mapped to you — search, favorite, and drill into any profile.</div>
    </div>
  </div>
  <div id="cp_staleBadge"></div>
</div>

<div class="filters-bar">
  <div class="row g-2 align-items-center">
    <div class="col-md-4">
      <input type="text" class="form-control" id="cp_search" placeholder="Search competitors...">
    </div>
    <div class="col-md-3">
      <select class="form-select" id="cp_sort">
        <option value="rate_asc">Rate: Low to High</option>
        <option value="rate_desc">Rate: High to Low</option>
        <option value="distance">Distance</option>
        <option value="stars">Star Rating</option>
      </select>
    </div>
    <div class="col-md-3">
      <select class="form-select" id="cp_filter">
        <option value="">All Competitors</option>
        <option value="favorite">Favorites</option>
        <option value="pinned">Pinned</option>
      </select>
    </div>
    <div class="col-md-2 d-flex justify-content-md-end">
      <div class="btn-group" role="group" aria-label="View toggle">
        <button type="button" class="btn btn-soft" id="cp_viewGrid" title="Grid view"><i class="bi bi-grid-3x3-gap-fill"></i></button>
        <button type="button" class="btn btn-soft" id="cp_viewList" title="List view"><i class="bi bi-list-ul"></i></button>
      </div>
    </div>
  </div>
</div>

<div class="row g-3" id="competitorGrid"></div>

<div class="card-surface p-0 overflow-hidden d-none" id="competitorListWrap">
  <div class="table-responsive">
    <table class="table-modern w-100">
      <thead><tr>
        <th>Competitor</th><th>Location</th><th class="text-center">Star Rating</th>
        <th class="text-end">Current Rate</th><th class="text-end">vs. Mine</th><th class="text-center">Trend</th>
        <th>Mapping</th><th class="text-end">Actions</th>
      </tr></thead>
      <tbody id="competitorList"></tbody>
    </table>
  </div>
  <div id="competitorListEmpty"></div>
</div>

<!-- Competitor Profile Modal -->
<div class="modal fade" id="competitorProfileModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-xl">
    <div class="modal-content" style="border-radius:18px;border:none">
      <div class="modal-header border-0">
        <h5 class="modal-title fw-bold" id="cprof_title">-</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body pt-0" id="cprof_body"></div>
    </div>
  </div>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="js/data.js"></script>
<script src="js/rbac.js"></script>
<script src="js/main.js"></script>
<script src="js/portal-data.js"></script>
<script src="js/portal-shell.js"></script>
<script src="js/portal-widgets.js"></script>
<script src="js/property-competitors.js"></script>
</body>
</html>
