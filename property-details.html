<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Property Details | Hotel Owner Panel</title>
<link rel="icon" href="data:,">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<link href="css/portal.css" rel="stylesheet">
</head>
<body>
<div id="app-shell">

<ul class="nav nav-tabs-modern mb-3" id="detailTabs">
  <li class="nav-item"><button class="nav-link active" data-tab="overview">Overview</button></li>
  <li class="nav-item"><button class="nav-link" data-tab="channels">Channels</button></li>
  <li class="nav-item"><button class="nav-link" data-tab="rooms">Rooms</button></li>
  <li class="nav-item"><button class="nav-link" data-tab="rateplans">Rate Plans</button></li>
  <li class="nav-item"><button class="nav-link" data-tab="ratecalendar">Rate Calendar</button></li>
  <li class="nav-item"><button class="nav-link" data-tab="contact">Contact & Amenities</button></li>
</ul>

<div id="tab-overview">
  <div class="section-card mb-3 p-0 overflow-hidden">
    <div style="height:220px;background-size:cover;background-position:center" id="coverImg"></div>
  </div>

  <div class="row g-3 mb-3" id="p_stats"></div>

  <div class="row g-3">
    <div class="col-lg-8">
      <div class="section-card mb-3">
        <div class="section-title mb-2">About This Property</div>
        <p class="text-muted" id="p_desc"></p>
      </div>
    </div>
    <div class="col-lg-4">
      <div class="section-card">
        <div class="section-title mb-3">Quick Info</div>
        <div class="kv-row"><span class="k">Type</span><span class="v" id="kv_type"></span></div>
        <div class="kv-row"><span class="k">City</span><span class="v" id="kv_city"></span></div>
        <div class="kv-row"><span class="k">Total Rooms</span><span class="v" id="kv_rooms"></span></div>
        <div class="kv-row"><span class="k">Created</span><span class="v" id="kv_created"></span></div>
      </div>
    </div>
  </div>
</div>

<div id="tab-channels" class="d-none">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div class="text-muted small" id="channelsCount"></div>
    <a href="#" id="addChannelBtn" class="btn btn-primary btn-sm"><i class="bi bi-plus-lg me-1"></i>Add Channel</a>
  </div>
  <div class="row g-3" id="channelsGrid"></div>
</div>

<div id="tab-rooms" class="d-none">
  <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
    <div class="d-flex align-items-center gap-2">
      <div class="text-muted small" id="roomsCount"></div>
      <select class="form-select form-select-sm" id="roomsChannelFilter" style="width:auto;min-width:180px"></select>
    </div>
    <a href="#" id="addRoomBtn" class="btn btn-primary btn-sm"><i class="bi bi-plus-lg me-1"></i>Add Room</a>
  </div>
  <div class="row g-3" id="roomsGrid"></div>
</div>

<div id="tab-rateplans" class="d-none">
  <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
    <div class="d-flex align-items-center gap-2">
      <div class="text-muted small" id="rpCount"></div>
      <select class="form-select form-select-sm" id="rpChannelFilter" style="width:auto;min-width:180px"></select>
    </div>
    <a href="#" id="addRpBtn" class="btn btn-primary btn-sm"><i class="bi bi-plus-lg me-1"></i>Add Rate Plan</a>
  </div>
  <div class="card-surface p-0 overflow-hidden">
    <table class="table-modern w-100">
      <thead><tr><th>Rate Plan</th><th>Channel</th><th>Room</th><th>Meal Plan</th><th>Cancellation</th><th>Status</th><th class="text-end">Actions</th></tr></thead>
      <tbody id="rpBody"></tbody>
    </table>
  </div>
</div>

<div id="tab-ratecalendar" class="d-none">
  <div class="section-card p-0 overflow-hidden">
    <iframe id="calendarFrame" src="" style="width:100%;height:78vh;border:none;display:block"></iframe>
  </div>
</div>

<div id="tab-contact" class="d-none">
  <div class="row g-3">
    <div class="col-lg-6">
      <div class="section-card">
        <div class="section-title mb-3">Contact Details</div>
        <div class="kv-row"><span class="k">Phone</span><span class="v" id="c_phone"></span></div>
        <div class="kv-row"><span class="k">Email</span><span class="v" id="c_email"></span></div>
        <div class="kv-row"><span class="k">Website</span><span class="v" id="c_website"></span></div>
        <div class="kv-row"><span class="k">Address</span><span class="v" id="c_address"></span></div>
      </div>
    </div>
    <div class="col-lg-6">
      <div class="section-card">
        <div class="section-title mb-3">Amenities</div>
        <div id="c_amenities"></div>
      </div>
    </div>
  </div>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/rbac.js"></script>
<script src="js/main.js"></script>
<script src="js/portal-data.js"></script>
<script src="js/portal-shell.js"></script>
<script src="js/property-details.js"></script>
</body>
</html>
