<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rate Matrix | Rate Shopper IQ</title>
<link rel="icon" href="data:,">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<link href="css/portal.css" rel="stylesheet">
<link href="css/rate-matrix.css" rel="stylesheet">
</head>
<body>
<div id="app-shell">

<div class="cal-toolbar">
  <div class="d-flex align-items-center gap-2 flex-wrap">
    <div class="d-flex align-items-center gap-2 flex-wrap">
      <div class="mx-range-segmented" id="mx_rangeSegmented" role="group">
        <button type="button" class="mx-seg-btn" data-preset="7">7D</button>
        <button type="button" class="mx-seg-btn" data-preset="14">14D</button>
        <button type="button" class="mx-seg-btn" data-preset="30">30D</button>
        <button type="button" class="mx-seg-btn" data-preset="90">90D</button>
        <div class="dropdown d-inline-block" id="mx_customDropdown">
          <button type="button" class="mx-seg-btn dropdown-toggle" id="mx_customBtn" data-preset="custom" data-bs-toggle="dropdown" data-bs-auto-close="outside">Custom</button>
          <div class="dropdown-menu p-0" id="mx_dateRangeMenu">
            <div class="mx-drp-custom" id="mx_drpCustom">
              <div class="d-flex justify-content-between align-items-center mb-2">
                <button type="button" class="btn btn-sm-icon btn-soft" id="mx_drpPrevMonth"><i class="bi bi-chevron-left"></i></button>
                <div class="d-flex gap-3">
                  <div class="fw-semibold small text-center" style="width:200px" id="mx_drpMonthLabel1"></div>
                  <div class="fw-semibold small text-center" style="width:200px" id="mx_drpMonthLabel2"></div>
                </div>
                <button type="button" class="btn btn-sm-icon btn-soft" id="mx_drpNextMonth"><i class="bi bi-chevron-right"></i></button>
              </div>
              <div class="d-flex gap-3">
                <div class="mx-drp-cal" id="mx_drpCal1"></div>
                <div class="mx-drp-cal" id="mx_drpCal2"></div>
              </div>
              <div class="d-flex justify-content-between align-items-center mt-2 pt-2 mx-drp-footer">
                <div class="text-muted small" id="mx_drpSelectedLabel">Select a start and end date</div>
                <div class="d-flex gap-2">
                  <button type="button" class="btn btn-light btn-sm" id="mx_drpCancel">Cancel</button>
                  <button type="button" class="btn btn-primary btn-sm" id="mx_drpApply" disabled>Apply</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <span class="text-muted small" id="mx_dateRangeLabel">-</span>
    </div>
  </div>
  <div class="d-flex align-items-center gap-2 flex-wrap">
    <input type="text" class="form-control form-control-sm" id="mx_search" placeholder="Search competitor or room..." style="width:200px">
    <div class="dropdown">
      <button class="btn btn-soft btn-sm dropdown-toggle" data-bs-toggle="dropdown" data-bs-auto-close="outside"><i class="bi bi-eye me-1"></i>Properties</button>
      <div class="dropdown-menu p-2" id="mx_columnMenu" style="min-width:220px;max-height:280px;overflow-y:auto"></div>
    </div>
    <div class="dropdown">
      <button class="btn btn-outline-primary btn-sm dropdown-toggle" data-bs-toggle="dropdown"><i class="bi bi-download me-1"></i>Export</button>
      <ul class="dropdown-menu dropdown-menu-end">
        <li><a class="dropdown-item" href="#" id="mx_exportCsv"><i class="bi bi-filetype-csv me-2"></i>Export CSV</a></li>
        <li><a class="dropdown-item" href="#" id="mx_exportExcel"><i class="bi bi-file-earmark-excel me-2"></i>Export Excel</a></li>
        <li><a class="dropdown-item" href="#" id="mx_exportPdf"><i class="bi bi-file-earmark-pdf me-2"></i>Export PDF</a></li>
      </ul>
    </div>
    <button class="btn btn-soft btn-sm" id="mx_print" title="Print"><i class="bi bi-printer"></i></button>
  </div>
</div>

<div class="filters-bar mx-filters">
  <div class="row g-2 mb-2">
    <div class="col-6 col-lg-3">
      <label class="form-label mb-1" style="font-size:.72rem">Competitor</label>
      <div class="dropdown w-100">
        <button class="btn btn-light w-100 dropdown-toggle text-truncate" type="button" id="mx_competitorBtn" data-bs-toggle="dropdown" data-bs-auto-close="outside">All Competitors</button>
        <div class="dropdown-menu p-2" id="mx_competitorMenu" style="min-width:240px;max-height:280px;overflow-y:auto"></div>
      </div>
    </div>
    <div class="col-6 col-lg-3">
      <label class="form-label mb-1" style="font-size:.72rem" for="mx_room">Room</label>
      <select class="form-select form-select-sm" id="mx_room"><option value="">All Rooms</option></select>
    </div>
    <div class="col-6 col-lg-3">
      <label class="form-label mb-1" style="font-size:.72rem" for="mx_occ">Occupancy</label>
      <select class="form-select form-select-sm" id="mx_occ">
        <option value="1">1 Guest</option>
        <option value="2" selected>2 Guests</option>
        <option value="3">3 Guests</option>
        <option value="4">4 Guests</option>
      </select>
    </div>
    <div class="col-6 col-lg-3">
      <label class="form-label mb-1" style="font-size:.72rem" for="mx_mealPlan">Meal Plan</label>
      <select class="form-select form-select-sm" id="mx_mealPlan"><option value="">All Meal Plans</option></select>
    </div>
  </div>
  <div class="row g-2">
    <div class="col-6 col-lg-4">
      <label class="form-label mb-1" style="font-size:.72rem" for="mx_channel">Channel</label>
      <select class="form-select form-select-sm" id="mx_channel"></select>
    </div>
    <div class="col-6 col-lg-4">
      <label class="form-label mb-1" style="font-size:.72rem" for="mx_ratePlan">Rate Plan</label>
      <select class="form-select form-select-sm" id="mx_ratePlan">
        <option value="">All Rate Plans</option>
        <option value="refundable">Flexible</option>
        <option value="nonrefundable">Non-Refundable</option>
      </select>
    </div>
    <div class="col-12 col-lg-4 d-flex align-items-end">
      <button class="btn btn-soft btn-sm w-100" id="mx_reset"><i class="bi bi-arrow-counterclockwise me-1"></i>Reset Filters</button>
    </div>
  </div>
</div>

<div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-2">
  <div class="text-muted small" id="mx_summary">-</div>
  <div class="text-muted small">
    <span class="mx-legend-dot"></span> Your rate
    &nbsp; <i class="bi bi-chevron-down"></i> Click a property to collapse/expand its rooms
    &nbsp; <img src="https://www.eglobe-solutions.com/channelmanager/images/parity-view.png" alt="" style="width:12px;height:12px;vertical-align:-1px"> Compare that room across channels
  </div>
</div>

<div class="section-card">
  <div id="mx_gridHost"></div>
</div>

</div>

<!-- Rate Parity Modal -->
<div class="modal fade" id="parityModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-xl">
    <div class="modal-content" style="border-radius:18px;border:none">
      <div class="modal-header border-0 pb-0">
        <div>
          <h5 class="modal-title fw-bold mb-1"><img src="https://www.eglobe-solutions.com/channelmanager/images/parity-view.png" alt="Rate Parity" class="parity-icon me-2" style="width:20px;height:20px">Rate Parity Comparison</h5>
          <div class="text-muted small" id="parityMeta">-</div>
        </div>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="parityGridHost"></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/rbac.js"></script>
<script src="js/main.js"></script>
<script src="js/portal-data.js"></script>
<script src="js/portal-shell.js"></script>
<script src="js/mapping-review.js"></script>
<script src="js/property-rate-matrix.js"></script>
</body>
</html>
